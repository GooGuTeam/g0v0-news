name: Validate content

# The Python itself is checked by `quality.yml`; this job is about what this repository
# serves.
on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          python-version: "3.12"
          enable-cache: true

      # Runs before the content check below: a schema that stopped saying what it used to
      # say would make that check pass for the wrong reason.
      - name: Check JSON schemas
        run: uv run python tools/validate.py --self-test

      # A stream that has been declared but not released yet passes here, with a warning:
      # the rules about a stream describe what is built, and a stream with no build has
      # nothing for them to describe. The warning clears itself on the first build.
      - name: Check content
        run: uv run python tools/validate.py
